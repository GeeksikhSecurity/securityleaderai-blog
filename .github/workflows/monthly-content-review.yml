# Monthly Content Review — Task 6 of
# docs/content-maintenance-visual-automation-handoff.md (stale/retire
# flagging automation). Runs scripts/check-stale-content.mjs and files the
# result as a GitHub issue.
#
# Why a GitHub issue and not a Notion view: the handoff doc left the
# surface as an open decision ("a Notion view, an auto-filed GitHub issue,
# or as output appended to the Task 1 maintenance report"). A GitHub issue
# was chosen because it needs no external service or credential beyond the
# repo's own built-in GITHUB_TOKEN — it works whether or not a session has
# a live Notion connection (this one didn't). If a Notion-connected session
# later wants the same list surfaced as a Notion view instead/also, this
# workflow's `outputs/stale-content-report-*.md` (committed by the
# "Commit the report" step) is a ready-made input — see that doc's Task 4/6
# notes.

name: Monthly Content Review

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  stale-check:
    name: Flag stale content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Run stale-content check
        id: check
        run: |
          node scripts/check-stale-content.mjs
          echo "report_path=outputs/stale-content-report-$(date -u +%Y-%m-%d).md" >> "$GITHUB_OUTPUT"

      - name: Commit the report
        # The report is a point-in-time snapshot worth keeping in git history
        # (same reasoning as outputs/daily-summary-*.md — CLAUDE.md's
        # Decision Capture section: "the log is the loop's on-disk memory").
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.check.outputs.report_path }}"
          git diff --cached --quiet && echo "No report changes to commit" || git commit -m "chore: monthly stale-content report $(date -u +%Y-%m)"
          git push

      - name: File a tracking issue
        # Tag-pinned, not SHA-pinned — allowed for first-party `actions/*`
        # publishers by this repo's own vercel-security-monitor.yml pin-
        # integrity check (it only requires a SHA pin on third-party
        # actions), so this matches existing policy rather than being an
        # exception to it.
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.check.outputs.report_path }}';
            const body = fs.readFileSync(reportPath, 'utf8');
            const now = new Date();
            const title = `Monthly Content Review — ${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
